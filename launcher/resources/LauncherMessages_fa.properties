guideActions=بازی، ورود و به‌روزرسانی
guideActionsBody=بازی ماینکرافت را با نسخهٔ نصب‌شده و تأییدشده باز می‌کند. ورود به Gunnertimes با همان نسخه برای اتصال به سرور رسمی تلاش می‌کند. به‌روزرسانی، نسخهٔ امضاشدهٔ جدید را به درخواست تو نصب می‌کند. برای بررسی بدون تغییر فایل‌ها از بخش پک، بررسی فایل‌ها را بزن. ترمیم قبل از اجرا فهرست فایل‌های قابل بازیابی را نشان می‌دهد.
