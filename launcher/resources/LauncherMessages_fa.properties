guideStart=اولین اجرا
guideStartBody=به تنظیمات برو، یک نام کاربری آفلاین وارد کن، پوشهٔ پروفایل را انتخاب کن و ذخیره بزن. در خانه ابتدا نصب و سپس بازی را بزن. برای دریافت ماینکرافت، فبریک و مادهای موجودنبوده در اولین اجرا به اینترنت نیاز داری.
guideFolder=پوشهٔ پروفایل چیست؟
guideFolderBody=پوشهٔ اصلی همین نصبِ ماینکرافت است. پوشه‌های mods، saves، config و logs داخل آن قرار می‌گیرند. لانچر می‌تواند در یک مسیر خالی پروفایل بسازد. اگر خود mods را انتخاب کنی، پوشهٔ والد آن استفاده می‌شود.
guideExamples=چه مسیری وارد کنم؟
guideDefault=پروفایل جدید (پیش‌فرض)
guideExisting=پروفایل فعلی Goharian New Server
guideFix=مشکل دانلود یا ماد
guideFixBody=پس از قطع اینترنت، تلاش دوباره را بزن. فایل‌های تأییدشده دوباره قابل استفاده‌اند. اگر ماد خراب یا متعارض گزارش شد، بازی را ببند، فایل نام‌برده را پیدا کن و پیش از تلاش دوباره آن را با حفظ نسخهٔ پشتیبان از پوشهٔ mods بیرون ببر.
guideLogs=لاگ‌ها و اجرای آفلاین
guideLogsBody=پوشهٔ لاگ‌ها از تنظیمات و لاگ کلاینت از پنل پیشرفت باز می‌شود. در صورت قطع کانال انتشار، پروفایلی که قبلاً تأیید شده از کش اجرا می‌شود. سرور چندنفره باید حساب آفلاین را بپذیرد.
