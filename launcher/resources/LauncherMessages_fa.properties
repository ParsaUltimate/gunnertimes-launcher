resetConfirm=تنظیمات پیش‌فرض لانچر برای پروفایل، بازی و جاوا اعمال می‌شوند. دنیاها و فایل‌های بازی در پوشه‌های فعلی باقی می‌مانند.
guideActions=بازی، ورود و به‌روزرسانی
guideActionsBody=«بازی» ماینکرفت را با پک نصب‌شده باز می‌کند. از منوی ماینکرفت می‌توانی وارد دنیای تک‌نفره شوی یا سرور انتخاب کنی.\n\n«ورود به Gunnertimes» بازی را باز می‌کند و برای اتصال به سرور رسمی تلاش می‌کند. سرور باید ورود آفلاین را بپذیرد.\n\n«به‌روزرسانی» در خانه، نسخهٔ جدیدتر پک را پس از تأیید نصب می‌کند. برای به‌روزرسانی خود لانچر، به تنظیمات ← دانلود و به‌روزرسانی ← بررسی به‌روزرسانی لانچر برو.
