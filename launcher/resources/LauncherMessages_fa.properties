guideStart=اولین اجرا
guideStartBody=۱. در تنظیمات ← بازیکن و پروفایل، یک نام کاربری آفلاین وارد کن. نام باید ۳ تا ۱۶ کاراکتر و شامل حروف انگلیسی، عدد یا زیرخط باشد. برای پروفایل جدید مسیر پیش‌فرض را نگه دار، یا پوشهٔ یک پروفایل موجود را انتخاب کن. سپس تنظیمات را ذخیره کن.\n\n۲. به خانه برو و «نصب» را بزن. بعد از آماده‌شدن پک، «بازی» را بزن. برای آماده‌سازی اولیه و دریافت فایل‌های موردنیاز، اتصال اینترنت لازم است.
guideFolder=پوشهٔ پروفایل چیست؟
guideFolderBody=پروفایل پوشه‌ای است که مادها، دنیاهای ذخیره‌شده (saves)، تنظیمات بازی (config) و لاگ‌ها در آن قرار می‌گیرند. می‌توانی مسیر پیش‌فرض زیر، یک پوشهٔ خالی برای پروفایل جدید یا پوشهٔ یک پروفایل موجود را انتخاب کنی.\n\nپوشه‌ای را انتخاب کن که mods داخل آن قرار دارد. اگر خودِ mods را انتخاب کنی، لانچر پوشهٔ والدش را در نظر می‌گیرد. برای محل فایل‌های اصلی بازی، بخش «فایل‌های مشترک ماینکرفت» را ببین.
guideDefault=پروفایل جدید (پیش‌فرض)
guideFix=مشکل دانلود یا ماد
guideFixBody=اگر دانلود قطع شد، پس از وصل‌شدن اینترنت «تلاش دوباره» را بزن. لانچر از فایل‌های تأییدشده دوباره استفاده می‌کند.\n\nاگر فایل یک ماد رسمی خراب است، ماینکرفت را ببند و در بخش پک «بررسی فایل‌ها» را بزن. این کار فقط فایل‌ها را می‌خواند. برای بازیابی نسخهٔ نصب‌شدهٔ پک، «ترمیم» را بزن، فهرست تغییرات را ببین و تأیید کن.\n\nاگر لانچر یک ماد دستیِ متعارض گزارش کرد، از فایل نام‌برده نسخهٔ پشتیبان بگیر، آن را از پوشهٔ mods پروفایل بیرون ببر و دوباره تلاش کن.
guideLogs=لاگ‌ها و اجرای آفلاین
guideLogsBody=برای دیدن گزارش‌های لانچر و بازی، «باز کردن پوشهٔ لاگ‌ها» را بزن. پس از شروع ماینکرفت، دکمهٔ «باز کردن لاگ بازی» در پنل پیشرفت، گزارش همان اجرا را باز می‌کند.\n\nوقتی پک و فایل‌های لازم بازی کامل هستند، از دکمهٔ «بازی» برای اجرای تک‌نفرهٔ آفلاین استفاده کن. این کار هنگام قطع کانال انتشار هم ممکن است.
