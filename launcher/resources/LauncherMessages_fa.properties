guideSharedBody=مسیر پیش‌فرض فایل‌های اصلی بازی، پوشهٔ استاندارد ماینکرفت در %APPDATA% است. لانچر فایل‌های سالم را مستقیم از پوشه‌های assets، libraries و versions می‌خواند. هنگام آماده‌سازی، پوشه‌های لازم را می‌سازد و فایل‌های ناقص یا خراب را از منابع رسمی ماینکرفت یا Fabric دریافت و اعتبارسنجی می‌کند.\n\nمسیر پروفایل را برای مادها، تنظیمات و دنیاها انتخاب کن. لانچر مسیر مشترک ماینکرفت را خودش پیدا می‌کند. مسیر دقیق را می‌توانی در تنظیمات ← دانلود و به‌روزرسانی ببینی.
