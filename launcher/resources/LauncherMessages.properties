guideStart=First launch
guideStartBody=Open Settings, enter an offline username, choose your profile folder, and save. Return to Play and start the game. The first run needs internet for Minecraft, Fabric and any missing mods.
guideFolder=What is a profile folder?
guideFolderBody=It is the game directory for one Minecraft installation. Its mods, saves, config and logs folders sit inside it. The launcher can create a new profile at an empty path. If you choose the mods folder itself, Gunnertimes uses its parent.
guideExamples=Which path should I enter?
guideDefault=New profile (default)
guideExisting=Existing Goharian New Server profile
guideFix=Download or mod problems
guideFixBody=After a network interruption, click Try again. Verified files can be reused. For a conflicting or damaged mod, close Minecraft, locate the named JAR and move it outside mods before retrying. Keep your own backup of that file.
guideLogs=Logs and offline use
guideLogsBody=Open logs in Settings or open the client log from Session progress. If the release channel is unavailable, an already verified profile can start from cache. Multiplayer servers must accept offline accounts.
