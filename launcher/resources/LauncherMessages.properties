guideActions=Play, Join and Update
guideActionsBody=Play opens Minecraft with the verified installed release. Join Gunnertimes attempts to connect to the official server using that release. Update installs a newer signed release on request. To check files without changing them, open Pack and choose Verify files. Repair previews the files it will restore.
