guideShared=Shared Minecraft files
guideSharedBody=Gunnertimes uses the standard Minecraft folder under %APPDATA% by default. It reads valid files directly from assets, libraries and versions. Missing or damaged files are verified and restored from official Minecraft or Fabric sources. The launcher creates the required folders as it prepares the game.\n\nChoose the profile path in Settings for your mods, config and saves. The shared Minecraft folder is selected automatically. To see the resolved path, open Settings → Downloads & updates.
