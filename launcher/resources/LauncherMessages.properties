guideStart=First launch
guideStartBody=1. Open Settings → Player and profile. Enter an offline username of 3–16 characters using letters A–Z, digits or underscores. Keep the default profile path to create a fresh profile, or choose an existing game folder. Save settings.\n\n2. Go to Home and select Install to download the official pack. When installation finishes, select Play. Stay online for the first setup and whenever required files are missing.
guideFolder=What is a profile folder?
guideFolderBody=The profile is the folder for your mods, worlds (saves), settings (config) and logs. You can use the default path below, choose an empty folder for a new profile, or select the folder of an existing profile.\n\nSelect the folder that contains mods. If you select mods itself, the launcher uses its parent. You can keep your profile anywhere writable. See Shared Minecraft files for the default location of the game files.
guideExamples=Which path should I enter?
guideDefault=New profile (default)
guideExisting=Example of an existing profile
guideFix=Download or mod problems
guideFixBody=If a download fails, reconnect to the internet and select Try again. Verified files are reused.\n\nFor damaged official mods, close Minecraft, open Pack and select Verify files. This is a read-only check. Select Repair, review the affected files and confirm to restore the installed pack version.\n\nIf the launcher reports a conflicting manual mod, move the named JAR outside the profile’s mods folder, keep a backup and retry.
guideLogs=Logs and offline use
guideLogsBody=Use Open logs below to find launcher and game logs in the selected profile. If Minecraft has already started, Open game log in the progress panel takes you directly to that run’s log.\n\nOnce the pack and all required game files are present, you can use Play offline for single-player, even when the release channel is unavailable.
