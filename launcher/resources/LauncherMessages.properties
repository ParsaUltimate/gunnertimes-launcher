guideActions=Play, Join and Update
guideActionsBody=Play starts Minecraft with the installed pack. Use it for single-player or to choose a server in Minecraft.\n\nJoin Gunnertimes starts the game and attempts to connect to the official server. The server must accept offline accounts.\n\nUpdate on Home installs a newer pack after confirmation. To update the launcher itself, go to Settings → Downloads & updates → Check for launcher updates.
